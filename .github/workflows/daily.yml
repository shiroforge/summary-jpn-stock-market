name: daily
# 平日 16:30 JST に実行し、データが未確定（終了コード75）なら 17:30 JST の回で再試行する。
on:
  schedule:
    - cron: "30 7 * * 1-5"  # 16:30 JST
    - cron: "30 8 * * 1-5"  # 17:30 JST (retry)
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄なら直近の営業日）"
        required: false
      force:
        description: "既に生成済みでも作り直す"
        type: boolean
        default: false
      notify:
        description: "Discordに通知する"
        type: boolean
        default: true

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      date: ${{ steps.plan.outputs.date }}
      built: ${{ steps.run.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - id: plan
        run: uv run jpmarket plan ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Skip (holiday or already built)
        if: steps.plan.outputs.trading != 'true' || (steps.plan.outputs.exists == 'true' && inputs.force != true)
        run: echo "nothing to do for ${{ steps.plan.outputs.date }}"

      - name: Restore price cache
        if: steps.plan.outputs.trading == 'true' && (steps.plan.outputs.exists != 'true' || inputs.force == true)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: jpmarket-cache-${{ github.run_id }}
          restore-keys: jpmarket-cache-

      - id: run
        name: Collect and build
        if: steps.plan.outputs.trading == 'true' && (steps.plan.outputs.exists != 'true' || inputs.force == true)
        run: |
          set +e
          uv run jpmarket -v run --date ${{ steps.plan.outputs.date }} --force
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif [ $code -eq 75 ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data for ${{ steps.plan.outputs.date }} not ready yet"
            # the 17:30 JST run is the last attempt of the day
            if [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ]; then
              uv run jpmarket notify-error "${{ steps.plan.outputs.date }} のデータが17:30時点でも未確定のため、生成を見送りました。" --run-url "$RUN_URL"
            fi
          else
            exit $code
          fi

      - name: Save price cache
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: jpmarket-cache-${{ github.run_id }}

      - name: Commit daily JSON
        if: steps.run.outputs.built == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898178+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git diff --cached --quiet || git commit -m "data: ${{ steps.plan.outputs.date }}"
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.built == 'true'
        with:
          path: site

      - name: Report failure
        if: failure()
        run: uv run jpmarket notify-error "${{ steps.plan.outputs.date || '不明な日付' }} の生成中にエラーが発生しました。" --run-url "$RUN_URL" || true

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: needs.build.outputs.built == 'true' && (github.event_name == 'schedule' || inputs.notify == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run jpmarket notify --date ${{ needs.build.outputs.date }}
      - if: failure()
        run: uv run jpmarket notify-error "Discordへの通知に失敗しました。" --run-url "$RUN_URL" || true
